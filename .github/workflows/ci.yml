name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v5.4.2

      - name: Install dependencies
        run: uv sync --extra dev --extra postgres

      - name: Ruff
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Pyright
        run: uv run pyright

      - name: Tests
        env:
          DATABASE_BACKEND: supabase
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_KEY: fake-key
          EMBEDDING_PROVIDER: ollama
          DEFAULT_PROFILE: default
        run: uv run pytest tests/ -m "not integration and not postgres_integration"
