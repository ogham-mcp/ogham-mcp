name: Publish

# Trusted Publishing (OIDC) -- no PyPI token anywhere. See TBU-198.
#
# The wheel has always been built on the maintainer's laptop from the PRIVATE
# dev repo, which meant nobody could verify that what shipped matched the source
# people could read. It also let two contributor migrations live only here and
# never reach the artifact (TBU-197). Building and publishing from this repo
# fixes both by construction.
#
# workflow_dispatch runs the build and its gates and publishes NOTHING -- use it
# to verify an artifact on demand. Only a v* tag reaches PyPI, and only after the
# `pypi` environment's required reviewer approves, so the upload is never the
# first anyone hears of it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build wheel + sdist
        run: uv build

      # The artifact audit runs HERE, against the files that will actually be
      # uploaded -- not against a build that never ships.
      - name: Leak audit
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl | head -1)
          SDIST=$(ls dist/*.tar.gz | head -1)
          echo "wheel: $(basename "$WHL")"
          echo "sdist: $(basename "$SDIST")"
          NAMES=$(python3 -c "import zipfile,sys;print(chr(10).join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$WHL")
          TARS=$(tar tzf "$SDIST")
          FAIL=0
          for pat in '\.claude/' 'benchmarks/' '^docs/' 'extras/' 'superpowers' 'memory/' 'agent_zero'; do
            HITS=$(printf '%s\n%s\n' "$NAMES" "$TARS" | grep -E "$pat" | grep -v '\.env\.example' || true)
            if [ -n "$HITS" ]; then
              echo "::error::forbidden path in artifact ($pat)"; printf '%s\n' "$HITS" | head -5; FAIL=1
            fi
          done
          COUNT=$(printf '%s\n' "$NAMES" | grep -c '\.py$')
          echo "python files in wheel: $COUNT"
          [ "$COUNT" -ge 50 ] || { echo "::error::only $COUNT .py files -- wheel looks wrong"; FAIL=1; }
          exit $FAIL

      - name: Import smoke against the built wheel
        run: |
          set -euo pipefail
          # The runner's system python3 is 3.12; this package needs >=3.13,
          # so build the venv with uv, which fetches the right interpreter.
          uv venv --python 3.13 /tmp/v
          uv pip install --python /tmp/v/bin/python "$(ls dist/*.whl | head -1)[postgres]"
          /tmp/v/bin/python - <<'PY'
          import importlib.metadata as md
          import ogham.cli, ogham.server, ogham.config  # noqa: F401
          from ogham.config import Settings
          assert Settings(server_transport="streamable-http")
          print("ok", md.version("ogham-mcp"))
          PY
          /tmp/v/bin/ogham --help > /dev/null
          /tmp/v/bin/ogham download-model --help > /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # required reviewer configured -- gates every real publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
