name: Publish

# Trusted Publishing (OIDC) -- no PyPI token anywhere. See TBU-198.
#
# The wheel has always been built on the maintainer's laptop from the PRIVATE
# dev repo, which meant nobody could verify that what shipped matched the source
# people could read. It also let two contributor migrations live only here and
# never reach the artifact (TBU-197). Building and publishing from this repo
# fixes both by construction.
#
# workflow_dispatch runs the build and its gates and publishes NOTHING -- use it
# to verify an artifact on demand. Only a v* tag reaches PyPI, and only after the
# `pypi` environment's required reviewer approves, so the upload is never the
# first anyone hears of it.
#
# `verify-handoff` (dispatch only) exists because the upload -> download step pair
# is otherwise reachable ONLY from a v* tag: its first real execution would be the
# same run as the first real OIDC publish. See TBU-204. It downloads the artifact
# through the same pin the `pypi` job uses and checks the files against digests
# recorded before upload, so a green dispatch is evidence about the release path
# and not about a copy of it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build wheel + sdist
        run: uv build

      # The artifact audit runs HERE, against the files that will actually be
      # uploaded -- not against a build that never ships.
      - name: Leak audit
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl | head -1)
          SDIST=$(ls dist/*.tar.gz | head -1)
          echo "wheel: $(basename "$WHL")"
          echo "sdist: $(basename "$SDIST")"
          NAMES=$(python3 -c "import zipfile,sys;print(chr(10).join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$WHL")
          TARS=$(tar tzf "$SDIST")
          FAIL=0
          for pat in '\.claude/' 'benchmarks/' '^docs/' 'extras/' 'superpowers' 'memory/' 'agent_zero'; do
            HITS=$(printf '%s\n%s\n' "$NAMES" "$TARS" | grep -E "$pat" | grep -v '\.env\.example' || true)
            if [ -n "$HITS" ]; then
              echo "::error::forbidden path in artifact ($pat)"; printf '%s\n' "$HITS" | head -5; FAIL=1
            fi
          done
          COUNT=$(printf '%s\n' "$NAMES" | grep -c '\.py$')
          echo "python files in wheel: $COUNT"
          [ "$COUNT" -ge 50 ] || { echo "::error::only $COUNT .py files -- wheel looks wrong"; FAIL=1; }
          exit $FAIL

      - name: Import smoke against the built wheel
        run: |
          set -euo pipefail
          # The runner's system python3 is 3.12; this package needs >=3.13,
          # so build the venv with uv, which fetches the right interpreter.
          uv venv --python 3.13 /tmp/v
          uv pip install --python /tmp/v/bin/python "$(ls dist/*.whl | head -1)[postgres]"
          /tmp/v/bin/python - <<'PY'
          import importlib.metadata as md
          import ogham.cli, ogham.server, ogham.config  # noqa: F401
          from ogham.config import Settings
          assert Settings(server_transport="streamable-http")
          print("ok", md.version("ogham-mcp"))
          PY
          /tmp/v/bin/ogham --help > /dev/null
          /tmp/v/bin/ogham download-model --help > /dev/null

      # The PyPI page IS the shopfront, and until 0.17.1 it was empty (TBU-201).
      # tests/test_packaging_metadata.py guards the pyproject side; only a build
      # can prove the fields survive into METADATA, so that check lives here,
      # against the artifact that will actually be uploaded.
      - name: PyPI page metadata
        run: |
          set -euo pipefail
          python3 - "$(ls dist/*.whl | head -1)" <<'PY'
          import email, re, sys, zipfile

          z = zipfile.ZipFile(sys.argv[1])
          name = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")][0]
          msg = email.message_from_string(z.read(name).decode())
          body = msg.get_payload()
          urls = msg.get_all("Project-URL") or []

          problems = []
          if msg["Description-Content-Type"] != "text/markdown":
              problems.append(f"Description-Content-Type is {msg['Description-Content-Type']!r}")
          if len(body) < 2000:
              problems.append(f"description body is {len(body)} chars -- README did not make it in")
          if not msg["Keywords"]:
              problems.append("Keywords absent")
          if not msg["License-Expression"]:
              problems.append("License-Expression absent")
          if not any(u.startswith("Repository,") for u in urls):
              problems.append(f"no Repository project URL (got {urls})")

          # PyPI renders the description off pypi.org, so a relative link 404s
          # there. In-page anchors (#section) are fine.
          relative = sorted({
              m.group(1) for m in re.finditer(r"\]\(([^)#][^)]*)\)", body)
              if not m.group(1).startswith(("http://", "https://", "mailto:"))
          })
          if relative:
              problems.append(f"relative links will not resolve on PyPI: {relative}")

          for p in problems:
              print(f"::error::{p}")
          if problems:
              sys.exit(1)
          print(f"ok -- {len(body)} chars, {len(urls)} project URLs, no relative links")
          PY

      # Recorded BEFORE upload, so `verify-handoff` compares against what this
      # job actually produced rather than against the transported copy checking
      # itself. Emitted in `sha256sum -c` format, which names the offending file
      # on mismatch instead of just disagreeing about one opaque hash.
      - name: Record artifact digests
        id: manifest
        run: |
          set -euo pipefail
          MANIFEST=$(cd dist && sha256sum -- * | sort)
          [ -n "$MANIFEST" ] || { echo "::error::dist/ is empty -- nothing to record"; exit 1; }
          printf '%s\n' "$MANIFEST"
          {
            echo "manifest<<MANIFEST_EOF"
            printf '%s\n' "$MANIFEST"
            echo "MANIFEST_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Dispatch only. Deliberately has NO `id-token: write` and NO `environment:`,
  # so it cannot reach PyPI even if someone later pastes a publish step into it.
  verify-handoff:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Verify the downloaded files match what was built
        env:
          MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          set -euo pipefail
          [ -n "${MANIFEST:-}" ] || { echo "::error::build recorded no manifest"; exit 1; }
          printf '%s\n' "$MANIFEST" > "$RUNNER_TEMP/manifest.sha256"
          COUNT=$(grep -c . "$RUNNER_TEMP/manifest.sha256" || true)
          [ "$COUNT" -ge 2 ] || { echo "::error::manifest lists $COUNT files, expected wheel + sdist"; exit 1; }
          ls -l dist/
          (cd dist && sha256sum -c "$RUNNER_TEMP/manifest.sha256")
          ls dist/*.whl >/dev/null && ls dist/*.tar.gz >/dev/null
          echo "upload -> download handoff verified across $COUNT files"

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # required reviewer configured -- gates every real publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
