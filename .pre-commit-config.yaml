repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Broad-spectrum secret detection. Catches what detect-private-key misses
  # (connection strings with passwords, cloud API keys, tokens). Gitleaks'
  # default ruleset covers ~160 patterns: postgres URLs, AWS keys, GitHub
  # tokens, Supabase sb_secret_, Neon npg_, Stripe sk_, Anthropic sk-ant-,
  # etc. Added 2026-04-23 after discovering an earlier PyPI release had
  # embedded Neon postgres URLs in the Makefile (dead creds, but caught
  # too late -- whole class should have been blocked at commit time).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Markdown style. `.markdownlint.yaml` says which rules are off and why;
  # `.markdownlintignore` says which files are exempt and why. Same hook and
  # rev as the other repos (voice-app-macalla et al).
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
